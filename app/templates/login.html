<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <link rel="stylesheet" href="/static/style.css">
    <div class="container">


        <h1>Login</h1>


        <form action="/login" method="post">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">
                Login
            </button>

        </form>

        {% if result %}

        {% if result.error %}

        <p class="error">
            {{ result.error }}
        </p>

        {% endif %}

        {% if result.success %}

        <p class="success">
            {{ result.success }}
        </p>

        {% endif %}

        {% endif %}

        <p>
            Don't have an account?
            <a href="/register">
                Register here
            </a>
        </p>



    </div>

</body>

</html>
