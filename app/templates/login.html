<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="auth-body">

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-header">
                <h1>🌤 Welcome Back</h1>
                <p>Login to your weather dashboard</p>
            </div>

            <form action="/login" method="post" class="auth-form">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            {% if result %}

                {% if result.error %}

                    <div class="error-box">
                        {{ result.error }}
                    </div>

                {% endif %}

                {% if result.success %}

                    <div class="success-box">
                        {{ result.success }}
                    </div>

                {% endif %}

            {% endif %}

            <p class="auth-switch">
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</body>

</html>
